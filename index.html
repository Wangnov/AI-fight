<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 公司全明星大乱斗</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="AI Fight is a browser arcade fighting game starring parody AI-company champions."
    />
    <meta property="og:title" content="AI Fight" />
    <meta
      property="og:description"
      content="A browser arcade fighting game about AI-company champions, built with PixiJS and Vite."
    />
    <meta property="og:image" content="/sprites/scene/menu_title.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        color: #fff;
      }
      body {
        position: relative;
      }
      #app {
        width: 1280px;
        height: 720px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transform-origin: center center;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
