<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Walk Cycle Demo</title>
    <style>
      body {
        margin: 0;
        background: #1a1a25;
        color: #ddd;
        font-family: system-ui, sans-serif;
      }
      .container {
        display: flex;
        gap: 40px;
        padding: 40px;
        flex-wrap: wrap;
      }
      .stage {
        position: relative;
        width: 480px;
        height: 540px;
        background: #2a2a35;
        border: 2px solid #444;
        border-radius: 8px;
        overflow: hidden;
      }
      .stage::after {
        content: '';
        position: absolute;
        bottom: 50px;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(120, 120, 140, 0.4);
      }
      .sprite {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform-origin: center bottom;
      }
      .sprite img {
        height: 460px;
        width: auto;
        display: block;
        transform: translateX(-50%);
      }
      .label {
        position: absolute;
        top: 8px;
        left: 12px;
        font-weight: bold;
        font-size: 18px;
      }
      .meta {
        position: absolute;
        top: 8px;
        right: 12px;
        font-size: 13px;
        color: #888;
      }
      .controls {
        padding: 20px 40px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .controls input[type=range] {
        width: 280px;
      }
      h1 {
        padding: 20px 40px 0;
        margin: 0;
      }
      .info {
        padding: 0 40px;
        color: #aaa;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Walk Cycle Demo — 4 帧 KOF 风格 (Ryu pose-strip 单图共生成)</h1>
    <p class="info">
      跟游戏内同节奏：每 12 帧 (200ms) 切一次 frame，1 完整 cycle = 0.8s。
      4 帧 cycle: contact_L / passing / contact_R / passing。
      Sprite Y offset PHASE_Y = [0, -3, 0, -3] 模拟 KOF 风格的极轻微 hip 起伏。
    </p>
    <div class="controls">
      <label>速度: <span id="speedLabel">1.0x</span></label>
      <input type="range" id="speed" min="0.25" max="2" step="0.25" value="1" />
      <button id="step">单步切下一帧</button>
      <button id="play">⏸ 暂停</button>
    </div>
    <div class="container">
      <div class="stage">
        <div class="label" style="color: #4ade80">ALTMAN</div>
        <div class="meta" id="altmanMeta">walk_01 · y=0</div>
        <div class="sprite" id="altmanSprite">
          <img id="altmanImg" src="/sprites/altman/altman_walk_01.png" />
        </div>
      </div>
      <div class="stage">
        <div class="label" style="color: #fb923c">DARIO</div>
        <div class="meta" id="darioMeta">walk_01 · y=0</div>
        <div class="sprite" id="darioSprite">
          <img id="darioImg" src="/sprites/dario/dario_walk_01.png" />
        </div>
      </div>
    </div>
    <script>
      const PHASE_Y = [0, -3, 0, -3];
      const TOTAL_FRAMES = 4;
      const FRAME_DURATION_MS = 200;
      const phaseLabels = [
        '01 contact_L', '02 passing', '03 contact_R', '04 passing',
      ];
      let speed = 1;
      let playing = true;
      let idx = 0;
      let lastSwitch = performance.now();

      function applyFrame(i) {
        const padNum = String(i + 1).padStart(2, '0');
        document.getElementById('altmanImg').src = `/sprites/altman/altman_walk_${padNum}.png`;
        document.getElementById('darioImg').src = `/sprites/dario/dario_walk_${padNum}.png`;
        const phaseY = PHASE_Y[i];
        // 每 12 帧内极轻微 sin bounce ±1（KOF 风格）
        const segPhase = ((Date.now() / 16.67) % 12) / 12 * Math.PI;
        const localLift = Math.sin(segPhase) * 1;
        const totalY = phaseY - localLift;
        document.getElementById('altmanSprite').style.transform = `translateY(${totalY}px)`;
        document.getElementById('darioSprite').style.transform = `translateY(${totalY}px)`;
        document.getElementById('altmanMeta').textContent = `${phaseLabels[i]} · y=${totalY.toFixed(1)}px`;
        document.getElementById('darioMeta').textContent = `${phaseLabels[i]} · y=${totalY.toFixed(1)}px`;
      }

      function loop(now) {
        if (playing) {
          const elapsed = now - lastSwitch;
          if (elapsed >= FRAME_DURATION_MS / speed) {
            idx = (idx + 1) % TOTAL_FRAMES;
            lastSwitch = now;
          }
        }
        applyFrame(idx);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      document.getElementById('speed').addEventListener('input', (e) => {
        speed = parseFloat(e.target.value);
        document.getElementById('speedLabel').textContent = `${speed.toFixed(2)}x`;
      });
      document.getElementById('step').addEventListener('click', () => {
        idx = (idx + 1) % TOTAL_FRAMES;
        lastSwitch = performance.now();
        playing = false;
        document.getElementById('play').textContent = '▶ 播放';
      });
      document.getElementById('play').addEventListener('click', (e) => {
        playing = !playing;
        e.target.textContent = playing ? '⏸ 暂停' : '▶ 播放';
        lastSwitch = performance.now();
      });
    </script>
  </body>
</html>
