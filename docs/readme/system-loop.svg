<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">AI Fight gameplay loop</title>
  <desc id="desc">A five step arcade loop from pick fighter to deploy.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#7d34ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="410" rx="18" fill="#05070d"/>
  <rect x="15" y="15" width="1170" height="380" rx="15" fill="#0a1020" stroke="url(#edge)" stroke-width="3"/>
  <g font-family="Impact, Arial Black, sans-serif" text-anchor="middle" filter="url(#softGlow)">
    <g transform="translate(210 84)">
      <rect x="-150" y="-32" width="300" height="118" rx="10" fill="#06131f" stroke="#00e5ff" stroke-width="3"/>
      <text y="18" font-size="36" fill="#ffffff">SELECT</text>
      <text y="57" font-family="monospace" font-size="20" fill="#8ef7ff">P1 / P2 READY</text>
    </g>
    <g transform="translate(600 84)">
      <rect x="-150" y="-32" width="300" height="118" rx="10" fill="#16100c" stroke="#ff7a18" stroke-width="3"/>
      <text y="18" font-size="36" fill="#ffffff">FIGHT</text>
      <text y="57" font-family="monospace" font-size="20" fill="#ffd7a8">HITSTOP + SHAKE</text>
    </g>
    <g transform="translate(990 84)">
      <rect x="-150" y="-32" width="300" height="118" rx="10" fill="#10132a" stroke="#7d34ff" stroke-width="3"/>
      <text y="18" font-size="36" fill="#ffffff">ULTIMATE</text>
      <text y="57" font-family="monospace" font-size="20" fill="#ddd3ff">BITMAP VFX</text>
    </g>
    <g transform="translate(405 222)">
      <rect x="-150" y="-32" width="300" height="118" rx="10" fill="#06131f" stroke="#00e5ff" stroke-width="3"/>
      <text y="18" font-size="36" fill="#ffffff">BUILD</text>
      <text y="57" font-family="monospace" font-size="20" fill="#8ef7ff">VITE DIST</text>
    </g>
    <g transform="translate(795 222)">
      <rect x="-150" y="-32" width="300" height="118" rx="10" fill="#16100c" stroke="#ff7a18" stroke-width="3"/>
      <text y="18" font-size="36" fill="#ffffff">DEPLOY</text>
      <text y="57" font-family="monospace" font-size="20" fill="#ffd7a8">CLOUDFLARE</text>
    </g>
  </g>
  <g stroke="url(#edge)" stroke-width="3" fill="none" opacity="0.7">
    <path d="M360 112H444"/>
    <path d="M756 112H840"/>
    <path d="M900 150C870 178 842 190 796 196"/>
    <path d="M600 232H510"/>
  </g>
  <text x="600" y="365" text-anchor="middle" font-family="monospace" font-size="24" fill="#d7dce8">Pick fighters. Create impact. Ship the chaos. Deploy the cabinet.</text>
</svg>
